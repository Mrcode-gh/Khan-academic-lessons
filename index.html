<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Khan Lessons - 77pen</title>
    <style>
        body { margin:0; background:#111; color:#fff; font-family:Arial; text-align:center; }
        .nav { background:#222; padding:10px; }
        .nav button { margin:5px; padding:10px 20px; background:#00cc99; color:#000; border:none; cursor:pointer; font-size:16px; }
        .nav button:hover { background:#00aa77; }
        #game-container { text-align:center; padding:20px; }
        iframe { border:none; width:480px; height:800px; box-shadow:0 0 20px rgba(0,0,0,0.8); }
        .title { margin:10px; font-size:28px; color:#00cc99; }
        .fake-screen { display:inline-block; padding:20px; background:#222; border:8px solid #333; box-shadow:0 0 30px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="fake-screen">
        <div class="title">Fake Khan Lessons</div>
        <div class="nav">
            <button onclick="loadLesson('math')">Math</button>
            <button onclick="loadLesson('science')">Science</button>
            <button onclick="loadLesson('history')">History</button>
        </div>
        <div id="game-container">
            <iframe id="game-frame" src="https://77pen.github.io/p/basketball-stars" allowfullscreen></iframe>
        </div>
    </div>

    <script>
    function loadLesson(lesson) {
        const frame = document.getElementById('game-frame');
        if (lesson === 'math') {
            frame.src = "https://77pen.github.io/p/basketball-stars";
        } else if (lesson === 'science') {
            frame.src = "https://77pen.github.io/p/we-become-what-we-behold.html";
        } else if (lesson === 'history') {
            frame.src = "https://77pen.github.io/p/drive-mad.html";
        }
    }
    </script>
</body>
</html>
